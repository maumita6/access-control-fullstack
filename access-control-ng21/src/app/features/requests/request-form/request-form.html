<section class="mb-12">
    <h1 class="text-2xl text-gradient font-semibold text-gray-900 mb-6"> Raise Access Request</h1>

    @if (errorMessage()) {
    <div class="error-banner">{{ errorMessage() }}</div>
    }
    <div
        class="border-gradient max-w-7xl bg-gray-50 p-12 sm:p-16 border border-gray-100 rounded-xl shadow-lg shadow-gray-200/70 ring-1 ring-black/[0.02]">

        <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" class="max-w-3xl space-y-4">
            <div class="form-group">
                <label for="requestName" class="block text-sm font-medium text-gray-700 mb-2">Request Name</label>
                <input id="requestName" type="text" formControlName="requestName" placeholder="e.g., Hotfix DB Access"
                    class="w-full px-3 py-3 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm placeholder-gray-400" />
                @if (requestForm.get('requestName')?.touched && requestForm.get('requestName')?.errors?.['required']) {
                <span class="error-text text-red-500 text-sm">Request name is required.</span>
                }
            </div>

            <div class="form-group">
                <label for="system" class="block text-sm font-medium text-gray-700 mb-2">System</label>
                <select id="system" formControlName="system"
                    class="w-full px-3 py-3 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                    <option value="Production Database">Production Database</option>
                    <option value="AWS Console">AWS Console</option>
                    <option value="Staging Server">Staging Server</option>
                </select>
            </div>

            <div class="form-group">
                <label for="access" class="block text-sm font-medium text-gray-700 mb-2">Access Type</label>
                <select id="access" formControlName="access"
                    class="w-full px-3 py-3 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                    <option value="READ">Read</option>
                    <option value="WRITE">Write</option>
                    <option value="READ_WRITE">Read / Write</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration" class="block text-sm font-medium text-gray-700 mb-2">Duration (Hours)</label>
                <input id="duration" type="number" formControlName="duration"
                    class="w-full px-3 py-3 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
            </div>

            <div class="pt-2  mt-6">
                <button type="submit" [disabled]="isLoading()"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-md shadow transition-colors duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    {{ isLoading() ? 'Submitting...' : 'Submit Request' }}
                </button>
            </div>

        </form>
    </div>
</section>
